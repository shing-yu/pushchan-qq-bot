[project]
name = "qq-push-bot"
version = "0.1.0"
description = "接收本地 API 请求并推送私聊/群聊消息的 QQ 机器人"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "httpx>=0.27",
    "loguru>=0.7",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
